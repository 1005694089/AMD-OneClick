# AMD OneClick Manager v2 - isolated deployment for OAuth/Credits rollout
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: amd-oneclick-manager-v2
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: amd-oneclick-manager-v2
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: amd-oneclick-manager-v2
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: amd-oneclick-manager-v2
subjects:
  - kind: ServiceAccount
    name: amd-oneclick-manager-v2
    namespace: default

---
apiVersion: v1
kind: Secret
metadata:
  name: amd-oneclick-postgres
  namespace: default
type: Opaque
stringData:
  POSTGRES_DB: "amd_oneclick"
  POSTGRES_USER: "amd_oneclick"
  POSTGRES_PASSWORD: "<replace-with-postgres-password>"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amd-oneclick-postgres
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amd-oneclick-postgres
  template:
    metadata:
      labels:
        app: amd-oneclick-postgres
    spec:
      nodeName: wx-ms-w7900d-0005
      containers:
        - name: postgres
          image: crpi-xhg6joi134vrkpzq.cn-shanghai.personal.cr.aliyuncs.com/vivienfanghua/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: amd-oneclick-postgres
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: pgdata
          hostPath:
            path: /var/lib/amd-oneclick-postgres
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: amd-oneclick-postgres
  namespace: default
spec:
  selector:
    app: amd-oneclick-postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: amd-oneclick-config-v2
  namespace: default
data:
  K8S_NAMESPACE: "default"
  DEFAULT_IMAGE: "crpi-xhg6joi134vrkpzq.cn-shanghai.personal.cr.aliyuncs.com/vivienfanghua/amd-oneclick-base:rocm7.2.1-py3.12-v20260416"
  CPU_LIMIT: "16"
  MEMORY_LIMIT: "64Gi"
  GPU_LIMIT: "1"
  CPU_REQUEST: "8"
  MEMORY_REQUEST: "32Gi"
  HF_CACHE_HOST_PATH: "/var/lib/amd-oneclick/hf-cache"
  HF_CACHE_MOUNT_PATH: "/root/.cache/huggingface"
  HF_HUB_DISABLE_XET: "1"
  IDLE_TIMEOUT_MINUTES: "10"
  MAX_LIFETIME_HOURS: "6"
  SERVICE_HOST: "36.151.243.69"
  PUBLIC_BASE_URL: "https://radeon.oneclickamd.ai"
  NODE_PORT_BASE: "30000"
  NOTEBOOK_TOKEN: "amd-oneclick"
  NOTEBOOK_LABEL_PREFIX: "amd-oneclick-v2"
  GITHUB_REDIRECT_URI: "https://radeon.oneclickamd.ai/auth/github/callback"
  MODELSCOPE_REDIRECT_URI: "https://radeon.oneclickamd.ai/auth/modelscope/callback"

---
apiVersion: v1
kind: Secret
metadata:
  name: amd-oneclick-secrets-v2
  namespace: default
type: Opaque
stringData:
  ADMIN_PASSWORD: "<replace-with-admin-password>"
  SESSION_SECRET: "<replace-with-random-session-secret>"
  GITHUB_CLIENT_ID: "<replace-with-github-client-id>"
  GITHUB_CLIENT_SECRET: "<replace-with-github-client-secret>"
  MODELSCOPE_CLIENT_ID: "<replace-with-modelscope-client-id>"
  MODELSCOPE_CLIENT_SECRET: "<replace-with-modelscope-client-secret>"
  MODELSCOPE_AUTH_URL: "https://modelscope.cn/oauth/authorize"
  MODELSCOPE_TOKEN_URL: "https://modelscope.cn/oauth/token"
  MODELSCOPE_USERINFO_URL: "https://modelscope.cn/api/v1/user"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amd-oneclick-manager-v2
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amd-oneclick-manager-v2
  template:
    metadata:
      labels:
        app: amd-oneclick-manager-v2
    spec:
      nodeName: wx-ms-w7900d-0005
      serviceAccountName: amd-oneclick-manager-v2
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 8.8.4.4
        options:
          - name: ndots
            value: "5"
      containers:
        - name: manager
          image: crpi-xhg6joi134vrkpzq.cn-shanghai.personal.cr.aliyuncs.com/vivienfanghua/amd-oneclick:preview-cache-atomic-20260515-1649
          imagePullPolicy: IfNotPresent
          workingDir: /app
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: amd-oneclick-config-v2
            - secretRef:
                name: amd-oneclick-secrets-v2
            - secretRef:
                name: amd-oneclick-postgres
          resources:
            limits:
              cpu: "2"
              memory: "1Gi"
            requests:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: amd-oneclick-manager-v2
  namespace: default
spec:
  selector:
    app: amd-oneclick-manager-v2
  type: NodePort
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30088
