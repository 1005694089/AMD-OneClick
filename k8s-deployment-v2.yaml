# AMD OneClick Manager v2 - isolated deployment for OAuth/Credits rollout
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: amd-oneclick-manager-v2
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: amd-oneclick-manager-v2
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: amd-oneclick-manager-v2-network-disk
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: amd-oneclick-manager-v2-network-disk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: amd-oneclick-manager-v2-network-disk
subjects:
  - kind: ServiceAccount
    name: amd-oneclick-manager-v2
    namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: amd-oneclick-manager-v2-nodeport-reader
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: amd-oneclick-manager-v2-nodeport-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: amd-oneclick-manager-v2-nodeport-reader
subjects:
  - kind: ServiceAccount
    name: amd-oneclick-manager-v2
    namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: amd-oneclick-manager-v2
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: amd-oneclick-manager-v2
subjects:
  - kind: ServiceAccount
    name: amd-oneclick-manager-v2
    namespace: default

---
apiVersion: v1
kind: Secret
metadata:
  name: amd-oneclick-postgres
  namespace: default
type: Opaque
stringData:
  POSTGRES_DB: "amd_oneclick"
  POSTGRES_USER: "amd_oneclick"
  POSTGRES_PASSWORD: "<replace-with-postgres-password>"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amd-oneclick-postgres
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amd-oneclick-postgres
  template:
    metadata:
      labels:
        app: amd-oneclick-postgres
    spec:
      nodeName: wx-ms-w7900d-0005
      imagePullSecrets:
        - name: acr-enterprise-pull
      containers:
        - name: postgres
          image: radeon-cloud-registry.cn-shanghai.cr.aliyuncs.com/admin/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: amd-oneclick-postgres
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: pgdata
          hostPath:
            path: /var/lib/amd-oneclick-postgres
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: amd-oneclick-postgres
  namespace: default
spec:
  selector:
    app: amd-oneclick-postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: amd-oneclick-config-v2
  namespace: default
data:
  K8S_NAMESPACE: "default"
  DEFAULT_IMAGE: "crpi-xhg6joi134vrkpzq.cn-shanghai.personal.cr.aliyuncs.com/vivienfanghua/amd-oneclick-base:rocm7.2.1-py3.12-v20260416"
  ENTERPRISE_REGISTRY_HOST: "radeon-cloud-registry.cn-shanghai.cr.aliyuncs.com"
  ADMIN_IMAGE_REGISTRY: "radeon-cloud-registry.cn-shanghai.cr.aliyuncs.com/admin"
  ADMIN_IMAGE_UPLOAD_REPOSITORY: "radeon-cloud-registry.cn-shanghai.cr.aliyuncs.com/admin/radeon-admin-upload"
  CUSTOM_IMAGE_REGISTRY: "radeon-cloud-registry.cn-shanghai.cr.aliyuncs.com/cloud_user"
  CUSTOM_IMAGE_REPOSITORY: ""
  CUSTOM_IMAGE_PULL_SECRET_NAME: "acr-enterprise-pull"
  IMAGE_PULL_SECRET_REGISTRY_HOSTS: "radeon-cloud-registry.cn-shanghai.cr.aliyuncs.com"
  CPU_LIMIT: "16"
  MEMORY_LIMIT: "64Gi"
  GPU_LIMIT: "1"
  CPU_REQUEST: "8"
  MEMORY_REQUEST: "32Gi"
  HF_CACHE_HOST_PATH: "/var/lib/amd-oneclick/hf-cache"
  HF_CACHE_MOUNT_PATH: "/root/.cache/huggingface"
  HF_HUB_DISABLE_XET: "1"
  WORKSPACE_HOST_ROOT: "/workspace/amd-oneclick"
  WORKSPACE_MOUNT_PATH: "/workspace"
  NETWORK_DISK_ENABLED: "false"
  NETWORK_DISK_PVC_NAME: "oneclick-network-disk-test"
  NETWORK_DISK_MOUNT_PATH: "/network-workspace"
  NETWORK_DISK_SUBPATH_PREFIX: "instances"
  NETWORK_DISK_SIZE_GI: "20"
  NETWORK_DISK_PVC_PREFIX: "oneclick-network-disk"
  NETWORK_DISK_NFS_SERVER: "10.233.211.13"
  NETWORK_DISK_NFS_PATH_PREFIX: "/instances"
  NETWORK_DISK_SERVER_NODE_NAME: "wx-ms-w7900d-0005"
  NETWORK_DISK_IMAGE_HOST_ROOT: "/workspace/oneclick-network-disk/images"
  NETWORK_DISK_EXPORT_HOST_ROOT: "/workspace/oneclick-network-disk/export"
  IDLE_TIMEOUT_MINUTES: "10"
  MAX_LIFETIME_HOURS: "6"
  SERVICE_HOST: "36.151.243.69"
  PUBLIC_BASE_URL: "https://radeon.anruicloud.com"
  NODE_PORT_BASE: "30000"
  NOTEBOOK_TOKEN: "amd-oneclick"
  IMAGE_CACHE_NODE_AFFINITY_ENABLED: "true"
  K8S_READ_TIMEOUT_SECONDS: "5"
  NOTEBOOK_LABEL_PREFIX: "amd-oneclick-v2"
  POD_CREATE_RETRY_ATTEMPTS: "30"
  POD_CREATE_RETRY_DELAY_SECONDS: "5"
  DATABASE_POOL_SIZE: "10"
  DATABASE_MAX_OVERFLOW: "10"
  DATABASE_POOL_TIMEOUT_SECONDS: "30"
  DATABASE_POOL_RECYCLE_SECONDS: "1800"
  GITHUB_REDIRECT_URI: "https://radeon.anruicloud.com/auth/github/callback"
  MODELSCOPE_REDIRECT_URI: "https://radeon.anruicloud.com/auth/modelscope/callback"
  TELEMETRY_API_URL: "http://36.150.116.200:30090/v1/metrics"
  ONECLICK_TELEMETRY_ENABLED: "true"
  ONECLICK_TELEMETRY_SOURCE: "amd_oneclick"
  ONECLICK_TELEMETRY_PRODUCT: "radeon_cloud"
  COUPON_REDEEM_ENABLED: "true"
  COUPON_REDEEM_DISABLED_MESSAGE: "System maintenance is in progress. Credit redemption is temporarily unavailable. Please contact the administrator if you need credits."
  OSS_ENABLED: "false"
  OSS_BUCKET: "cri-kw9uiu28ixf3otvo-registry"
  OSS_ENDPOINT: "oss-cn-shanghai-internal.aliyuncs.com"
  OSS_REGION: "cn-shanghai"
  OSS_BACKUP_PREFIX: "cloud_user"
  OSS_INSTANCE_QUOTA_GB: "10"
  OSS_BACKUP_INTERVAL_MINUTES: "10"
  OSS_IDLE_EXPIRY_DAYS: "15"
  OSS_IDLE_REAPER_DRY_RUN: "true"
  OSS_STS_ROLE_ARN: "<replace-with-oss-sts-role-arn>"
  OSS_STS_DURATION_SECONDS: "7200"
  OSS_STS_REFRESH_INTERVAL_MINUTES: "45"
  OSSUTIL_IMAGE: "radeon-cloud-registry.cn-shanghai.cr.aliyuncs.com/admin/ossutil:1.7.19"
  OSS_TERMINATION_GRACE_PERIOD_SECONDS: "45"
  OSS_EXCLUDES: ".git,.cache,__pycache__,node_modules,.venv,venv,env,datasets,*.pt,*.pth,*.safetensors,*.bin,*.gguf"

---
apiVersion: v1
kind: Secret
metadata:
  name: amd-oneclick-secrets-v2
  namespace: default
type: Opaque
stringData:
  ADMIN_PASSWORD: "<replace-with-admin-password>"
  SESSION_SECRET: "<replace-with-random-session-secret>"
  GITHUB_CLIENT_ID: "<replace-with-github-client-id>"
  GITHUB_CLIENT_SECRET: "<replace-with-github-client-secret>"
  MODELSCOPE_CLIENT_ID: "<replace-with-modelscope-client-id>"
  MODELSCOPE_CLIENT_SECRET: "<replace-with-modelscope-client-secret>"
  MODELSCOPE_AUTH_URL: "https://modelscope.cn/oauth/authorize"
  MODELSCOPE_TOKEN_URL: "https://modelscope.cn/oauth/token"
  MODELSCOPE_USERINFO_URL: "https://modelscope.cn/api/v1/user"
  COUPON_PRIVATE_KEY_PEM: "<replace-with-coupon-private-key-pem>"
  METRICS_INGEST_API_KEY: "<replace-with-metrics-ingest-api-key>"
  OSS_RAM_ACCESS_KEY_ID: "<replace-with-oss-ram-access-key-id>"
  OSS_RAM_ACCESS_KEY_SECRET: "<replace-with-oss-ram-access-key-secret>"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amd-oneclick-manager-v2
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amd-oneclick-manager-v2
  template:
    metadata:
      labels:
        app: amd-oneclick-manager-v2
    spec:
      nodeName: wx-ms-w7900d-0005
      serviceAccountName: amd-oneclick-manager-v2
      imagePullSecrets:
        - name: acr-enterprise-pull
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 8.8.4.4
        options:
          - name: ndots
            value: "5"
      containers:
        - name: manager
          image: radeon-cloud-registry.cn-shanghai.cr.aliyuncs.com/admin/amd-oneclick:v2-acr-oss-dark-20260611
          imagePullPolicy: IfNotPresent
          workingDir: /app
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: amd-oneclick-config-v2
            - secretRef:
                name: amd-oneclick-secrets-v2
            - secretRef:
                name: amd-oneclick-postgres
          resources:
            limits:
              cpu: "2"
              memory: "1Gi"
            requests:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: amd-oneclick-manager-v2
  namespace: default
spec:
  selector:
    app: amd-oneclick-manager-v2
  type: NodePort
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30088
