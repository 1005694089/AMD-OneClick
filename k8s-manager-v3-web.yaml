---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amd-oneclick-manager-v3-web
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: amd-oneclick-manager-v3-web
  template:
    metadata:
      labels:
        app: amd-oneclick-manager-v3-web
    spec:
      serviceAccountName: amd-oneclick-manager-v2
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - wx-ms-w7900d-0027
                      - wx-ms-w7900d-0044
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: amd-oneclick-manager-v3-web
                topologyKey: kubernetes.io/hostname
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 8.8.4.4
        options:
          - name: ndots
            value: "5"
      containers:
        - name: manager
          image: crpi-xhg6joi134vrkpzq.cn-shanghai.personal.cr.aliyuncs.com/vivienfanghua/amd-oneclick:manager-v3-hardened-20260601-2225
          imagePullPolicy: IfNotPresent
          workingDir: /app
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: amd-oneclick-config-v2
            - secretRef:
                name: amd-oneclick-secrets-v2
            - secretRef:
                name: amd-oneclick-postgres
          env:
            - name: MANAGER_ROLE
              value: "web"
          resources:
            limits:
              cpu: "2"
              memory: "1Gi"
            requests:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: amd-oneclick-manager-v3-web
  namespace: default
spec:
  selector:
    app: amd-oneclick-manager-v3-web
  type: NodePort
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30089
