# FULL merged Role for the manager SA — replaces the live Role in one apply.
# PolicyRule lists have no merge key, so this MUST contain every existing rule
# (daemonsets, pods+log, services, pvc, tunnel secrets, leases), or perms are wiped.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: amd-oneclick-lablab-manager
  namespace: amd-oneclick-lablab
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Dynamic per-Pod tunnel credentials. Kubernetes RBAC cannot restrict
  # create/patch to a Secret name prefix, so this is namespace-scoped and omits
  # list/watch. The application only accepts the deterministic frp-tunnel-* name.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update"]
