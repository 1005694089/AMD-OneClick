---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amd-oneclick-workshop-postgres
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amd-oneclick-workshop-postgres
  template:
    metadata:
      labels:
        app: amd-oneclick-workshop-postgres
    spec:
      nodeName: wx-ms-w7900d-0005
      containers:
        - name: postgres
          image: crpi-xhg6joi134vrkpzq.cn-shanghai.personal.cr.aliyuncs.com/vivienfanghua/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: amd-oneclick-workshop-postgres
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: pgdata
          hostPath:
            path: /var/lib/amd-oneclick-workshop-postgres
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: amd-oneclick-workshop-postgres
  namespace: default
spec:
  selector:
    app: amd-oneclick-workshop-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amd-oneclick-manager-v3-light
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amd-oneclick-manager-v3-light
  template:
    metadata:
      labels:
        app: amd-oneclick-manager-v3-light
    spec:
      serviceAccountName: amd-oneclick-manager-v2
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - wx-ms-w7900d-0027
                      - wx-ms-w7900d-0044
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: amd-oneclick-manager-v3-light
                topologyKey: kubernetes.io/hostname
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 8.8.4.4
        options:
          - name: ndots
            value: "5"
      containers:
        - name: manager
          image: crpi-xhg6joi134vrkpzq.cn-shanghai.personal.cr.aliyuncs.com/vivienfanghua/amd-oneclick:manager-v3-workshop-db-20260602-0030
          imagePullPolicy: IfNotPresent
          workingDir: /app
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: amd-oneclick-config-v2
            - secretRef:
                name: amd-oneclick-secrets-v2
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: amd-oneclick-workshop-postgres
                  key: DATABASE_URL
            - name: RUN_SCHEDULER
              value: "false"
            - name: OAUTH_CONNECT_TIMEOUT_SECONDS
              value: "5"
            - name: OAUTH_READ_TIMEOUT_SECONDS
              value: "15"
            - name: SLOW_REQUEST_THRESHOLD_SECONDS
              value: "2"
            - name: NOTEBOOK_LABEL_PREFIX
              value: "amd-oneclick-v3-workshop"
            - name: WORKSHOP_LOGIN_ENABLED
              value: "true"
            - name: WORKSHOP_USER_COUNT
              value: "150"
            - name: WORKSHOP_CREDITS
              value: "10000"
          resources:
            limits:
              cpu: "2"
              memory: "1Gi"
            requests:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: amd-oneclick-manager-v3-light
  namespace: default
spec:
  selector:
    app: amd-oneclick-manager-v3-light
  type: NodePort
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30089
