---
apiVersion: v1
kind: Namespace
metadata:
  name: amd-oneclick-network-disk
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oneclick-nfs-server
  namespace: amd-oneclick-network-disk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oneclick-nfs-server
  template:
    metadata:
      labels:
        app: oneclick-nfs-server
    spec:
      nodeName: wx-ms-w7900d-0005
      containers:
        - name: nfs
          image: crpi-xhg6joi134vrkpzq.cn-shanghai.personal.cr.aliyuncs.com/vivienfanghua/nfs-server-alpine:12
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: SHARED_DIRECTORY
              value: /exports
          ports:
            - name: nfs
              containerPort: 2049
            - name: rpcbind
              containerPort: 111
            - name: mountd
              containerPort: 20048
          volumeMounts:
            - name: export
              mountPath: /exports
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: export
          hostPath:
            path: /workspace/oneclick-network-disk/export
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: oneclick-nfs-server
  namespace: amd-oneclick-network-disk
spec:
  clusterIP: 10.233.211.13
  selector:
    app: oneclick-nfs-server
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
    - name: rpcbind
      port: 111
      targetPort: 111
    - name: mountd
      port: 20048
      targetPort: 20048
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oneclick-network-disk-test
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  volumeName: oneclick-network-disk-test
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: oneclick-network-disk-test
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 10.233.211.13
    path: /
