# radeon-global (ns amd-oneclick-lablab) hardening — NEW isolated Postgres + Redis.
# Brand-new services; MUST NOT influence the v2 stack in ns default.
# Placement: the two CPU-tainted nodes (taint hardware=cpu:NoSchedule, verified as their ONLY taint).
# Pinned individually: postgres->wu-ms-w7900d-0014, redis->wx-ms-w7900d-0018 (avoids co-location AND
# prevents a postgres replacement from ever landing on a second node while the old pod lingers -> no
# two-writer split-brain on the non-RWO-enforcing nfs.csi PVC).
# Service names carry a -p1 suffix ON PURPOSE: a Service literally named "amd-oneclick-postgres" would
# make the kubelet inject AMD_ONECLICK_POSTGRES_SERVICE_HOST into the manager pod on its next restart,
# and store.py auto-derives DATABASE_URL from that (with an empty password) -> self-inflicted crash.
# Phase 2 cutover wires an EXPLICIT DATABASE_URL to these -p1 services instead.
# Secrets (amd-oneclick-postgres, amd-oneclick-redis, acr-lablab-pull) are created imperatively — NOT here.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: amd-oneclick-postgres-data
  namespace: amd-oneclick-lablab
  labels: {app: amd-oneclick-postgres, tier: datastore}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: oneclick-cpu-nfs-1
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amd-oneclick-postgres
  namespace: amd-oneclick-lablab
  labels: {app: amd-oneclick-postgres, tier: datastore}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: amd-oneclick-postgres}
  template:
    metadata:
      labels: {app: amd-oneclick-postgres, tier: datastore}
    spec:
      terminationGracePeriodSeconds: 60
      # NFS export is root_squash (root->65534) and the mount + empty pgdata are owned by 65534.
      # Run as 65534 so the entrypoint skips the (squash-forbidden) chown and initdb runs as the owner.
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
      imagePullSecrets:
        - name: acr-lablab-pull
      tolerations:
        - {key: hardware, operator: Equal, value: cpu, effect: NoSchedule}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: ["wu-ms-w7900d-0014"]}
      containers:
        - name: postgres
          image: crpi-xhg6joi134vrkpzq.cn-shanghai.personal.cr.aliyuncs.com/vivienfanghua/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5432}]
          envFrom:
            - secretRef: {name: amd-oneclick-postgres}
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "4", memory: 8Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: amd-oneclick-postgres-data}
---
apiVersion: v1
kind: Service
metadata:
  name: amd-oneclick-postgres-p1
  namespace: amd-oneclick-lablab
  labels: {app: amd-oneclick-postgres, tier: datastore}
spec:
  selector: {app: amd-oneclick-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amd-oneclick-redis
  namespace: amd-oneclick-lablab
  labels: {app: amd-oneclick-redis, tier: datastore}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: amd-oneclick-redis}
  template:
    metadata:
      labels: {app: amd-oneclick-redis, tier: datastore}
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: acr-lablab-pull
      tolerations:
        - {key: hardware, operator: Equal, value: cpu, effect: NoSchedule}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: ["wx-ms-w7900d-0018"]}
      containers:
        - name: redis
          image: crpi-xhg6joi134vrkpzq.cn-shanghai.personal.cr.aliyuncs.com/vivienfanghua/redis:7-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: {name: amd-oneclick-redis}
          command: ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\" --save \"\" --appendonly no"]
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec: {command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec: {command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: amd-oneclick-redis-p1
  namespace: amd-oneclick-lablab
  labels: {app: amd-oneclick-redis, tier: datastore}
spec:
  selector: {app: amd-oneclick-redis}
  ports: [{port: 6379, targetPort: 6379}]
---
# Restrict who can reach the datastores. Ingress-only: allow ONLY the manager pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: amd-oneclick-postgres-ingress
  namespace: amd-oneclick-lablab
spec:
  podSelector:
    matchLabels: {app: amd-oneclick-postgres}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: amd-oneclick-lablab-manager}
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: amd-oneclick-redis-ingress
  namespace: amd-oneclick-lablab
spec:
  podSelector:
    matchLabels: {app: amd-oneclick-redis}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: amd-oneclick-lablab-manager}
      ports:
        - {protocol: TCP, port: 6379}
