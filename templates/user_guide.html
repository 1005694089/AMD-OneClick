<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Guide - Radeon Cloud</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.27.6/dist/reset.css" />
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/antd@5.27.6/dist/antd.min.js"></script>
  <style>
    body { margin:0; background:#f5f6fb; color:#1f2430; }
    .app-header { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 28px; background:#fff; border-bottom:1px solid #edf0f5; position:sticky; top:0; z-index:20; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:800; font-size:20px; }
    .brand img { width:40px; height:40px; object-fit:contain; }
    .content { max-width:1120px; margin:0 auto; padding:40px 24px 72px; }
    .hero { background:#050505; color:#fff; border-radius:28px; padding:42px; margin-bottom:24px; }
    .hero p { color:#c5c2cf; max-width:760px; line-height:1.7; }
    .guide-grid { display:grid; grid-template-columns: 260px minmax(0, 1fr); gap:22px; align-items:start; }
    .toc { position:sticky; top:88px; }
    .toc a { display:block; padding:8px 0; color:#4b5563; }
    .guide-section { margin-bottom:18px; }
    .guide-section h2 { margin-top:0; }
    .step-list li { margin:8px 0; line-height:1.65; }
    code { background:#f0f2f7; padding:2px 6px; border-radius:6px; }
    .path-table .ant-descriptions-item-label { width:180px; }
    @media (max-width:900px){ .app-header{padding:0 16px;} .content{padding:28px 16px 56px;} .hero{padding:30px 24px;} .guide-grid{grid-template-columns:1fr;} .toc{position:static;} }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const { Alert, Button, Card, Descriptions, Layout, Space, Tag, Typography } = antd;
    const { Header, Content } = Layout;
    const { Title, Text, Paragraph } = Typography;
    const user = {{ (user or {}) | tojson }};

    function Section({ id, title, children }) {
      return React.createElement(Card, { id, className:'guide-section' },
        React.createElement(Title, { level:2 }, title),
        children
      );
    }

    function Steps({ items }) {
      return React.createElement('ol', { className:'step-list' }, items.map((item, idx) => React.createElement('li', { key:idx }, item)));
    }

    function App() {
      const toc = [
        ['quickstart', 'Quick Start'],
        ['templates', 'Notebook Templates'],
        ['instances', 'Instances'],
        ['credits', 'Credits'],
        ['storage', 'Persistent Storage'],
        ['rules', 'Usage Rules'],
        ['troubleshooting', 'Troubleshooting'],
      ];

      return React.createElement(Layout, null,
        React.createElement(Header, { className:'app-header' },
          React.createElement('div', { className:'brand' },
            React.createElement('img', { src:'https://amd-ai-academy.com/static/image.png' }),
            React.createElement('span', null, 'Radeon Cloud')
          ),
          React.createElement(Space, null,
            React.createElement(Button, { href:'/' }, 'Gallery'),
            React.createElement(Button, { href:'/profile', type:'primary' }, user && user.email ? 'Profile' : 'Login')
          )
        ),
        React.createElement(Content, { className:'content' },
          React.createElement('section', { className:'hero' },
            React.createElement(Text, { style:{ color:'#aaa7bc', textTransform:'uppercase', letterSpacing:'.12em', fontWeight:800 } }, 'Developer User Guide'),
            React.createElement(Title, { level:1, style:{ color:'#fff', margin:'10px 0 12px' } }, 'Build and run GPU notebooks on Radeon Cloud'),
            React.createElement(Paragraph, null, 'This guide explains the main developer workflows: creating templates, launching and deleting GPU instances, managing credits, and using persistent storage safely.')
          ),
          React.createElement('div', { className:'guide-grid' },
            React.createElement(Card, { className:'toc', title:'Contents' },
              toc.map(([id, label]) => React.createElement('a', { key:id, href:`#${id}` }, label))
            ),
            React.createElement('div', null,
              React.createElement(Section, { id:'quickstart', title:'Quick Start' },
                React.createElement(Steps, { items:[
                  React.createElement(React.Fragment, null, 'Sign in from the ', React.createElement('a', { href:'/profile' }, 'Profile'), ' page.'),
                  React.createElement(React.Fragment, null, 'Open the ', React.createElement('a', { href:'/' }, 'Gallery'), ' and choose a prepared notebook template, or switch to ', React.createElement('a', { href:'/?tab=notebook' }, 'Notebook'), ' to launch a blank OpenCode-ready workspace.'),
                  React.createElement(React.Fragment, null, 'Choose your GPU count and, when available, CPU/memory profile. Use larger profiles for memory-heavy workloads.'),
                  React.createElement(React.Fragment, null, 'Wait until the instance is ready, then click ', React.createElement('strong', null, 'Open Notebook'), '.'),
                  React.createElement(React.Fragment, null, 'When finished, delete the instance from ', React.createElement('a', { href:'/profile' }, 'Profile'), ' to stop consuming credits.'),
                ]})
              ),
              React.createElement(Section, { id:'templates', title:'Notebook Templates' },
                React.createElement(Paragraph, null, 'Templates package a container image plus optional GitHub repository metadata so other developers can preview and launch a reproducible notebook environment.'),
                React.createElement(Title, { level:4 }, 'Create a template'),
                React.createElement(Steps, { items:[
                  React.createElement(React.Fragment, null, 'From the Gallery page, click ', React.createElement('strong', null, 'Create Template'), '.'),
                  React.createElement(React.Fragment, null, 'Enter a title, description, category, tags, and container image.'),
                  React.createElement(React.Fragment, null, 'For a notebook template, provide the GitHub repo URL, branch, and notebook path. Leave repo and path empty for an image-only workspace.'),
                  React.createElement(React.Fragment, null, 'Save the template. Editor/admin approval may be required before a template is visible to everyone.'),
                ]}),
                React.createElement(Title, { level:4 }, 'Preview and launch'),
                React.createElement(Paragraph, null, 'Use Preview to inspect notebook content before launching. Preview content is cached by the platform, so changes in GitHub may take time to appear unless an administrator refreshes the preview cache.')
              ),
              React.createElement(Section, { id:'instances', title:'Instances' },
                React.createElement(Alert, { type:'info', showIcon:true, style:{ marginBottom:16 }, message:'One active instance per account', description:'Each account can keep only one active GPU instance. Delete the current instance before launching another.' }),
                React.createElement(Title, { level:4 }, 'Launch an instance'),
                React.createElement(Steps, { items:[
                  React.createElement(React.Fragment, null, 'Launch from a Gallery template or from ', React.createElement('a', { href:'/?tab=notebook' }, '?tab=notebook'), '.'),
                  React.createElement(React.Fragment, null, 'Select GPU count. Credit usage is charged per GPU-hour.'),
                  React.createElement(React.Fragment, null, 'For blank notebooks, select CPU/memory profile. Auto currently scales memory with GPU count.'),
                  React.createElement(React.Fragment, null, 'Open the notebook when status becomes ready.'),
                ]}),
                React.createElement(Title, { level:4 }, 'Delete an instance'),
                React.createElement(Paragraph, null, 'Go to Profile, find Active Instance, then click Destroy Instance. This stops billing and releases GPU resources. Your persistent files remain according to the storage rules below.')
              ),
              React.createElement(Section, { id:'credits', title:'Credits' },
                React.createElement(Paragraph, null, 'Credits control GPU usage. Running instances are charged by GPU count and runtime. For example, a 4-GPU instance consumes credits faster than a 1-GPU instance.'),
                React.createElement(Alert, { type:'warning', showIcon:true, style:{ marginBottom:16 }, message:'Credit redemption may be temporarily unavailable', description:'If redemption is disabled during system maintenance, contact the administrator for credits.' }),
                React.createElement(Steps, { items:[
                  React.createElement(React.Fragment, null, 'Check available credits on the ', React.createElement('a', { href:'/profile' }, 'Profile'), ' page.'),
                  React.createElement(React.Fragment, null, 'If redemption is enabled, paste your coupon in Redeem Credits.'),
                  React.createElement(React.Fragment, null, 'If your credits run out, the platform may automatically delete the running instance. Save your work regularly.'),
                ]})
              ),
              React.createElement(Section, { id:'storage', title:'Persistent Storage' },
                React.createElement(Paragraph, null, 'Instances expose two storage locations. Use them intentionally.'),
                React.createElement(Descriptions, { bordered:true, column:1, className:'path-table', items:[
                  { key:'local', label:'/workspace', children:React.createElement(React.Fragment, null, 'Local persistent workspace bound to the current node. It survives container restarts such as OOMKilled, but may not follow the instance if it is recreated on another node.') },
                  { key:'network', label:'/network-workspace', children:React.createElement(React.Fragment, null, 'Network workspace when enabled. It is backed by a per-instance 20Gi network disk and can be mounted from different nodes.') },
                  { key:'hf', label:'/root/.cache/huggingface', children:'Shared model cache used by selected base images. Do not use it for private project files.' },
                ]}),
                React.createElement(Alert, { type:'success', showIcon:true, style:{ marginTop:16 }, message:'Recommended', description:'Put notebooks, scripts, checkpoints, and results that must survive restarts under /network-workspace when it is available. Use /workspace for fast local scratch data tied to the current instance.' })
              ),
              React.createElement(Section, { id:'rules', title:'Usage Rules' },
                React.createElement(Paragraph, null, 'Radeon Cloud is intended for development, evaluation, education, and research workloads on AMD GPUs.'),
                React.createElement('ul', { className:'step-list' },
                  React.createElement('li', null, 'Do not run cryptocurrency mining or unrelated background workloads.'),
                  React.createElement('li', null, 'Do not share credentials, coupons, or access tokens.'),
                  React.createElement('li', null, 'Do not attempt to bypass credit, storage, or instance limits.'),
                  React.createElement('li', null, 'Delete idle instances promptly to free GPU capacity for other developers.')
                )
              ),
              React.createElement(Section, { id:'troubleshooting', title:'Troubleshooting' },
                React.createElement(Title, { level:4 }, 'Instance is slow to start'),
                React.createElement(Paragraph, null, 'Large images may take time to pull. If launch takes unusually long, refresh Profile and check whether an active instance exists.'),
                React.createElement(Title, { level:4 }, 'Notebook files disappeared after restart'),
                React.createElement(Paragraph, null, 'Files under /network-workspace should survive instance recreation when network disk is enabled. Files stored outside /workspace or /network-workspace may be part of the container filesystem and can be lost.'),
                React.createElement(Title, { level:4 }, 'Out of memory'),
                React.createElement(Paragraph, null, 'Use a larger CPU/memory profile when launching from the Notebook tab. For 2-GPU and 4-GPU workloads, Auto recommends larger memory profiles.'),
                React.createElement(Title, { level:4 }, 'Need help'),
                React.createElement(Paragraph, null, 'Contact the platform administrator with your account email, instance id, template name, and a short description of the issue.')
              )
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
