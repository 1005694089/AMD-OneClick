<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Radeon Cloud</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.27.6/dist/reset.css" />
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/antd@5.27.6/dist/antd.min.js"></script>
  <script src="/static/template_form.js?v=20260709-storage"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
  <style>
    /* Always reserve scrollbar space so switching between short and tall tabs
       never changes viewport width and shifts the centered layout. */
    html { overflow-y: scroll; scrollbar-gutter: stable; }
    body { margin:0; background:#f5f6fb; }
    /* Even, stable tab bar: each tab takes equal width and the bar fills the row,
       so labels of different lengths don't produce uneven gaps. */
    .content > .ant-tabs > .ant-tabs-nav .ant-tabs-nav-list { width:100%; }
    .content > .ant-tabs > .ant-tabs-nav .ant-tabs-tab { flex:1; justify-content:center; margin:0 !important; }
    .content > .ant-tabs > .ant-tabs-nav { margin-bottom:20px; }
    .header { min-height:64px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:12px 28px; background:#fff; border-bottom:1px solid #edf0f5; }
    .brand { display:flex; align-items:center; gap:12px; font-size:20px; font-weight:800; min-width:0; }
    .brand img { width:40px; height:40px; object-fit:contain; flex:0 0 40px; }
    /* width:100% is required because .content is a flex child of .ant-layout;
       with margin:0 auto alone the auto margins disable flex stretch and the
       box collapses to its content width, so the layout shifts between tabs. */
    .content { width:100%; max-width:1440px; margin:0 auto; padding:32px 32px 64px; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
    .toolbar-actions, .header-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .table-code { display:block; max-width:100%; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .ant-table-cell code { white-space: normal; word-break: break-all; line-height: 1.45; }
    .ant-card { border-radius: 14px; }
    .ant-statistic-content { font-size: 24px; }
    .admin-metrics { display:flex; gap:32px; flex-wrap:wrap; }
    .stats-chart { width:100%; height:320px; }
    .user-search { width:min(360px, 100%); }
    .form-row { display:grid; grid-template-columns: minmax(0,1fr) 220px; gap:16px; align-items:start; }
    .form-row.three { grid-template-columns: 180px minmax(0,1fr) 120px; }
    .form-row.notebook { grid-template-columns: 180px minmax(0,1fr); }
    @media (max-width:900px){ .toolbar{align-items:flex-start;flex-direction:column;} .content{padding:24px 16px 48px;} .user-search{width:100%;} .form-row,.form-row.three,.form-row.notebook{grid-template-columns:1fr;} }
  </style>
</head>
<body>
<div id="root"></div>
<script>
const { Button, Card, Form, Input, InputNumber, Layout, Menu, Modal, Select, Space, Statistic, Switch, Table, Tabs, Tag, Typography, Popconfirm, message } = antd;
const { Header, Content } = Layout;
const { Title, Text } = Typography;
const gpuDashboardEnabled = {{ gpu_dashboard_enabled | default(false) | tojson }};

function GpuNodesPanel({data,loading}){
  const nodes=(data&&data.nodes)||[];
  const total=data.total_gpus||0, free=data.free_gpus||0, used=data.used_gpus||0;
  const util=total>0?Math.round((used/total)*100):0;
  const nodeColumns=[
    {title:'Node',dataIndex:'node',key:'node'},
    {title:'GPU Model',dataIndex:'gpu_model',key:'gpu_model',render:v=>v||'—'},
    {title:'Health',key:'health',render:(_,r)=>React.createElement(Space,{size:4,wrap:true},
      React.createElement(Tag,{color:r.ready?'green':'red'},r.ready?'Ready':'NotReady'),
      r.cordoned?React.createElement(Tag,{color:'orange'},'Cordoned'):null,
      r.quarantined?React.createElement(Tag,{color:'volcano'},'Quarantined'):null
    )},
    {title:'GPUs (used / total)',key:'gpus',render:(_,r)=>`${r.committed} / ${r.total}`},
    {title:'Free',dataIndex:'free',key:'free'},
    {title:'CPU',dataIndex:'cpu_allocatable',key:'cpu',render:v=>v||'—'},
    {title:'Memory (GiB)',dataIndex:'memory_allocatable_gib',key:'mem',render:v=>v||'—'},
    {title:'Instances',key:'inst',render:(_,r)=>(r.instances||[]).length}
  ];
  return React.createElement(Space,{direction:'vertical',size:20,style:{width:'100%'}},
    React.createElement(Card,{loading},
      React.createElement('div',{className:'admin-metrics'},
        React.createElement(Statistic,{title:'Total GPUs',value:total}),
        React.createElement(Statistic,{title:'Used GPUs (this deployment)',value:used}),
        React.createElement(Statistic,{title:'Schedulable free GPUs',value:free}),
        React.createElement(Statistic,{title:'Utilization',value:util,suffix:'%'})
      ),
      React.createElement(Text,{type:'secondary',style:{display:'block',marginTop:8}},
        'Used GPUs reflect this deployment’s namespace only; node capacity & health cover all GPU nodes. “Schedulable free” excludes idle GPUs on cordoned / NotReady / quarantined nodes, so Used + Schedulable free can be less than Total.')
    ),
    React.createElement(Card,{title:'Per-node GPU utilization',loading},
      React.createElement('div',{id:'adminGpuChart',className:'stats-chart'})),
    React.createElement(Card,{title:'GPU Nodes'},
      React.createElement(Table,{rowKey:'node',columns:nodeColumns,dataSource:nodes,loading,pagination:false,
        scroll:{x:'max-content'},size:'middle',
        expandable:{
          expandedRowRender:r=>React.createElement(Table,{rowKey:'id',size:'small',pagination:false,
            dataSource:r.instances||[],
            columns:[
              {title:'Instance',dataIndex:'id',key:'id'},
              {title:'User',dataIndex:'email',key:'email',render:v=>v||'—'},
              {title:'GPUs',dataIndex:'gpu_count',key:'gpu_count'},
              {title:'Type',dataIndex:'pod_type',key:'pod_type',render:v=>v||'—'},
              {title:'Status',dataIndex:'status',key:'status'}
            ]}),
          rowExpandable:r=>(r.instances||[]).length>0
        }
      }))
  );
}

function App(){
  const [images,setImages]=React.useState([]);
  const [instances,setInstances]=React.useState([]);
  const [users,setUsers]=React.useState([]);
  const [templates,setTemplates]=React.useState([]);
  const [stats,setStats]=React.useState({days:[],daily_users:[],daily_instance_launches:[],daily_active_users:[],total_instance_launches:0,total_active_users:0,total_users:0});
  const [gpunodes,setGpunodes]=React.useState({total_gpus:0,free_gpus:0,used_gpus:0,nodes:[],usage_scope:'namespace'});
  const [loaded,setLoaded]=React.useState({});
  const [sectionLoading,setSectionLoading]=React.useState({});
  const [activeTab,setActiveTab]=React.useState('overview');
  const [userSearch,setUserSearch]=React.useState('');
  const [templateSearch,setTemplateSearch]=React.useState('');
  const [templateEnabled,setTemplateEnabled]=React.useState('all');
  const [imageSearch,setImageSearch]=React.useState('');
  const [instanceSearch,setInstanceSearch]=React.useState('');
  const [form]=Form.useForm();
  const [templateForm]=Form.useForm();
  const [creditForm]=Form.useForm();
  const [bulkDestroyForm]=Form.useForm();
  const [imageModalOpen,setImageModalOpen]=React.useState(false);
  const [templateModalOpen,setTemplateModalOpen]=React.useState(false);
  const [bulkDestroyModalOpen,setBulkDestroyModalOpen]=React.useState(false);
  const [bulkDestroyLoading,setBulkDestroyLoading]=React.useState(false);
  const [editingTemplate,setEditingTemplate]=React.useState(null);
  const [creditModalUser,setCreditModalUser]=React.useState(null);
  const imageSourceType = Form.useWatch('source_type', form) || 'registry';

  // Each admin section loads its own (potentially expensive) endpoint on demand,
  // so the page opens fast instead of fetching everything up front.
  const SECTION_EP={users:'/api/admin/users',templates:'/api/admin/templates',images:'/api/admin/images',instances:'/api/admin/instances',stats:'/api/admin/stats',gpunodes:'/api/admin/gpu-nodes'};
  const SECTION_SET={users:setUsers,templates:setTemplates,images:setImages,instances:setInstances};
  async function loadSection(name,force){
    if(!name) return;
    if(!force && loaded[name]) return;
    setSectionLoading(s=>({...s,[name]:true}));
    try{
      const res=await fetch(SECTION_EP[name]);
      const data=await res.json();
      if(name==='stats') setStats(data||{});
      else if(name==='gpunodes') setGpunodes(data||{total_gpus:0,free_gpus:0,used_gpus:0,nodes:[],usage_scope:'namespace'});
      else SECTION_SET[name]((data&&data[name])||[]);
      setLoaded(l=>({...l,[name]:true}));
    }catch(e){ message.error('Failed to load '+name); }
    setSectionLoading(s=>({...s,[name]:false}));
  }
  async function refreshImages(){
    await loadSection('images', true);
  }
  const tabSection=key=>key==='overview'?'stats':key;
  function onTabChange(key){ setActiveTab(key); loadSection(tabSection(key)); }
  function refreshActive(){ loadSection(tabSection(activeTab),true); }
  React.useEffect(()=>{ loadSection('stats'); },[]);
  React.useEffect(()=>{
    if(activeTab!=='images') return;
    const hasActivePull = images.some(img => ['pulling','pending','distributing'].includes(img.sync_status));
    if(!hasActivePull) return;
    const interval = setInterval(refreshImages, 15000);
    return ()=>clearInterval(interval);
  },[images, activeTab]);
  React.useEffect(()=>{
    if(activeTab!=='overview') return;
    const node=document.getElementById('adminDailyStatsChart');
    if(!node || !window.echarts) return;
    const chart=echarts.init(node);
    chart.setOption({
      tooltip:{trigger:'axis'},
      legend:{top:0,data:['Instance Launches','Active Users','Users Registered']},
      grid:{top:48,left:42,right:24,bottom:42},
      xAxis:{type:'category',boundaryGap:false,data:stats.days||[]},
      yAxis:{type:'value',minInterval:1},
      series:[
        {name:'Instance Launches',type:'line',smooth:true,symbolSize:7,data:stats.daily_instance_launches||stats.daily_instances||[]},
        {name:'Active Users',type:'line',smooth:true,symbolSize:7,data:stats.daily_active_users||[]},
        {name:'Users Registered',type:'line',smooth:true,symbolSize:7,data:stats.daily_users||[]}
      ]
    });
    const resize=()=>chart.resize();
    window.addEventListener('resize',resize);
    // The Overview pane is display:none while another tab is active, so its
    // width is 0; on switching back echarts would init/keep that squished width
    // mid tab-transition. Observe the container and resize whenever it changes,
    // plus force a resize after the antd tab slide settles.
    let ro;
    if(window.ResizeObserver){ ro=new ResizeObserver(()=>chart.resize()); ro.observe(node); }
    requestAnimationFrame(resize);
    const t=setTimeout(resize,350);
    return()=>{window.removeEventListener('resize',resize); if(ro)ro.disconnect(); clearTimeout(t); chart.dispose();};
  },[stats,activeTab]);

  React.useEffect(()=>{
    if(activeTab!=='gpunodes') return;
    const node=document.getElementById('adminGpuChart');
    if(!node || !window.echarts) return;
    const list=(gpunodes.nodes||[]);
    const names=list.map(n=>n.node);
    const chart=echarts.init(node);
    chart.setOption({
      tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},
      legend:{top:0,data:['Used','Free']},
      grid:{top:48,left:140,right:24,bottom:42},
      xAxis:{type:'value',minInterval:1},
      yAxis:{type:'category',data:names},
      series:[
        {name:'Used',type:'bar',stack:'gpu',color:'#ff7875',data:list.map(n=>n.committed||0)},
        {name:'Free',type:'bar',stack:'gpu',color:'#95de64',data:list.map(n=>n.free||0)}
      ]
    });
    const resize=()=>chart.resize();
    window.addEventListener('resize',resize);
    let ro;
    if(window.ResizeObserver){ ro=new ResizeObserver(()=>chart.resize()); ro.observe(node); }
    requestAnimationFrame(resize);
    const t=setTimeout(resize,350);
    return()=>{window.removeEventListener('resize',resize); if(ro)ro.disconnect(); clearTimeout(t); chart.dispose();};
  },[gpunodes,activeTab]);

  function confirmLargeImage(){
    return new Promise(resolve=>{
      Modal.confirm({
        title:'Start image distribution?',
        content:'Distributing large images (tens of GB) to GPU nodes can take several minutes. Continue?',
        okText:'Continue', cancelText:'Cancel',
        onOk:()=>resolve(true), onCancel:()=>resolve(false),
      });
    });
  }
  async function addImage(values){
    if(!(await confirmLargeImage())) return;
    const res=await fetch('/api/admin/images',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:values.name, description:values.description, source_type:values.source_type||'registry', source_ref:values.source_ref, enabled:true})});
    if(res.ok){ message.success('Image added; pull started'); form.resetFields(); setImageModalOpen(false); loadSection('images',true); } else {
      const data = await res.json().catch(()=>({detail:'Failed to add image'}));
      message.error(data.detail || 'Failed to add image');
    }
  }
  async function syncImage(id){
    if(!(await confirmLargeImage())) return;
    const r=await fetch(`/api/admin/images/${id}/sync`,{method:'POST'});
    if(r.ok){ message.success('Pull started'); } else {
      const data = await r.json().catch(()=>({detail:'Sync failed'}));
      message.error(data.detail || 'Sync failed');
    }
    loadSection('images',true);
  }
  async function deleteImage(id){
    const r=await fetch(`/api/admin/images/${id}`,{method:'DELETE'});
    if(r.ok){ message.success('Deleted'); } else {
      const data = await r.json().catch(()=>({detail:'Delete failed'}));
      message.error(data.detail || 'Delete failed');
    }
    loadSection('images',true);
  }
  async function deleteInstance(id){ const r=await fetch(`/api/admin/instance/${encodeURIComponent(id)}`,{method:'DELETE'}); message[r.ok?'success':'error'](r.ok?'Destroyed':'Destroy failed'); loadSection('instances',true); }
  function openTemplateModal(record){
    setEditingTemplate(record||null);
    loadSection('images');
    templateForm.setFieldsValue(record ? {...record, tags:(record.tags||[]).join(', ')} : {branch:'main', enabled:true, sort_order:0});
    setTemplateModalOpen(true);
  }
  async function saveTemplate(values){
    const payload = {...values, enabled: values.enabled !== false, tags: values.tags || ''};
    const url = editingTemplate ? `/api/admin/templates/${editingTemplate.id}` : '/api/admin/templates';
    const res = await fetch(url,{method:editingTemplate?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(res.ok){ message.success(editingTemplate?'Template updated':'Template added'); templateForm.resetFields(); setEditingTemplate(null); setTemplateModalOpen(false); loadSection('templates',true); } else {
      const data = await res.json().catch(()=>({detail:'Template save failed'}));
      message.error(data.detail || 'Template save failed');
    }
  }
  async function deleteTemplate(id){ const r=await fetch(`/api/admin/templates/${id}`,{method:'DELETE'}); message[r.ok?'success':'error'](r.ok?'Template deleted':'Delete failed'); loadSection('templates',true); }
  async function bulkDestroyInstances(values){
    setBulkDestroyLoading(true);
    try{
      const res=await fetch('/api/admin/instances/bulk-destroy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({matcher:values.matcher})});
      const data=await res.json().catch(()=>({detail:'Bulk destroy failed'}));
      if(!res.ok) throw new Error(data.detail || 'Bulk destroy failed');
      message[data.failed_count?'warning':'success'](`Destroyed ${data.destroyed_count || 0}/${data.matched_count || 0} matched instances`);
      bulkDestroyForm.resetFields();
      setBulkDestroyModalOpen(false);
      loadSection('instances',true);
    }catch(e){
      message.error(e.message || 'Bulk destroy failed');
    }finally{
      setBulkDestroyLoading(false);
    }
  }
  async function grantCredits(values){
    if(!creditModalUser) return;
    const res=await fetch(`/api/admin/users/${creditModalUser.id}/credits`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values)});
    if(res.ok){ message.success('Credits granted'); creditForm.resetFields(); setCreditModalUser(null); loadSection('users',true); } else {
      const data = await res.json().catch(()=>({detail:'Failed to grant credits'}));
      message.error(data.detail || 'Failed to grant credits');
    }
  }
  async function setEditor(user, makeEditor){
    const res=await fetch(`/api/admin/users/${user.id}/editor`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_editor:makeEditor})});
    if(res.ok){ message.success(makeEditor?'Editor granted':'Editor revoked'); loadSection('users',true); } else {
      const data = await res.json().catch(()=>({detail:'Failed to update editor'}));
      message.error(data.detail || 'Failed to update editor');
    }
  }

  function imageStatusColor(status){
    // Image-service sync states: pending | pulling | ready | failed (distributing kept for the
    // launch-time per-node distribute path). Legacy prepull-only states (queued/skipped) removed.
    if(status === 'ready') return 'green';
    if(status === 'failed') return 'red';
    if(status === 'distributing') return 'cyan';
    return 'gold';
  }
  function imageStatusLabel(r){
    const count = r.desired_count ? ` (${r.ready_count != null ? r.ready_count : 0}/${r.desired_count} nodes)` : '';
    let acr = '';
    if(r.acr_backup_status === 'ready' || r.acr_backup_status === 'succeeded') acr = ' · ACR✓';
    else if(r.acr_backup_status === 'pending' || r.acr_backup_status === 'pulling' || r.acr_backup_status === 'distributing') acr = ' · ACR…';
    else if(r.acr_backup_status === 'failed') acr = ' · ACR✗';
    return `${r.sync_status}${count}${acr}`;
  }
  const imageColumns=[
    {title:'Name',dataIndex:'name',width:180},
    {title:'Image',dataIndex:'image',width:460,render:v=>React.createElement(Text,{code:true,copyable:true,className:'table-code',title:v},v)},
    {title:'Status',width:150,render:(_,r)=>React.createElement(Tag,{color:imageStatusColor(r.sync_status)},imageStatusLabel(r))},
    {title:'Message',dataIndex:'sync_message',width:220},
    {title:'Actions',width:170,render:(_,r)=>React.createElement(Space,null,
      React.createElement(Button,{size:'small',onClick:()=>syncImage(r.id)},'Sync'),
      React.createElement(Popconfirm,{title:'Delete image?',onConfirm:()=>deleteImage(r.id)},React.createElement(Button,{size:'small',danger:true},'Delete'))
    )}
  ];
  const templateColumns=[
    {title:'Title',dataIndex:'title',width:220,render:(v,r)=>React.createElement('div',null,React.createElement('strong',null,v),React.createElement('br'),React.createElement(Text,{type:'secondary'},r.slug))},
    {title:'Category',dataIndex:'category',width:140,render:v=>v||'-'},
    {title:'Image',dataIndex:'image',width:320,render:v=>React.createElement(Text,{code:true,copyable:true,className:'table-code',title:v},v)},
    {title:'Source',width:360,render:(_,r)=>r.repo_url&&r.notebook_path?React.createElement('div',null,React.createElement(Text,{code:true,copyable:true,className:'table-code',title:r.repo_url},r.repo_url),React.createElement('br'),React.createElement(Text,{type:'secondary'},`${r.branch}/${r.notebook_path}`)):React.createElement(Tag,{color:'blue'},'Image only')},
    {title:'Status',dataIndex:'enabled',width:100,render:v=>React.createElement(Tag,{color:v?'green':'default'},v?'enabled':'disabled')},
    {title:'Actions',width:210,render:(_,r)=>React.createElement(Space,null,
      r.repo_url&&r.notebook_path&&React.createElement(Button,{size:'small',href:`/templates/${r.id}/preview`,target:'_blank'},'Preview'),
      React.createElement(Button,{size:'small',onClick:()=>openTemplateModal(r)},'Edit'),
      React.createElement(Popconfirm,{title:'Delete template?',onConfirm:()=>deleteTemplate(r.id)},React.createElement(Button,{size:'small',danger:true},'Delete'))
    )}
  ];
  const instColumns=[
    {title:'Email',dataIndex:'email'},
    {title:'Type',dataIndex:'instance_type',render:v=>React.createElement(Tag,null,v)},
    {title:'Status',dataIndex:'status',render:v=>React.createElement(Tag,{color:v==='running'?'green':v==='failed'?'red':'gold'},v)},
    {title:'Uptime',dataIndex:'uptime_minutes',render:v=>`${v} min`},
    {title:'URL',dataIndex:'url',render:v=>v?React.createElement('a',{href:v,target:'_blank'},'Open'):'-'},
    {title:'Actions',render:(_,r)=>React.createElement(Popconfirm,{title:'Destroy instance?',onConfirm:()=>deleteInstance(r.id)},React.createElement(Button,{danger:true,size:'small'},'Destroy'))}
  ];
  const userColumns=[
    {title:'ID',dataIndex:'id',width:80},
    {title:'Email',dataIndex:'email',width:240,render:v=>React.createElement(Text,{copyable:true},v)},
    {title:'Name',dataIndex:'name',width:180,render:v=>v||'-'},
    {title:'Provider',dataIndex:'provider',width:120,render:v=>React.createElement(Tag,null,v)},
    {title:'Credits',dataIndex:'credits',width:120,sorter:(a,b)=>(a.credits||0)-(b.credits||0)},
    {title:'Editor',dataIndex:'is_editor',width:90,render:v=>v?React.createElement(Tag,{color:'green'},'Editor'):React.createElement(Tag,null,'No')},
    {title:'Created',dataIndex:'created_at',width:190,render:v=>v?dayjs(v).format('YYYY-MM-DD HH:mm'):'-'},
    {title:'Actions',width:280,render:(_,r)=>React.createElement(Space,{size:8},
      React.createElement(Button,{size:'small',type:'primary',onClick:()=>{setCreditModalUser(r); creditForm.setFieldsValue({amount:1000,reason:'manual admin grant'});}},'Grant Credits'),
      r.is_editor
        ? React.createElement(Button,{size:'small',danger:true,onClick:()=>setEditor(r,false)},'Revoke Editor')
        : React.createElement(Button,{size:'small',onClick:()=>setEditor(r,true)},'Make Editor')
    )}
  ];
  const filteredUsers = users.filter(user => {
    const keyword = userSearch.trim().toLowerCase();
    if(!keyword) return true;
    return [user.email,user.name,user.provider,user.provider_id,String(user.id)]
      .filter(Boolean)
      .some(value => String(value).toLowerCase().includes(keyword));
  });
  const filteredTemplates = templates.filter(t => {
    if(templateEnabled==='enabled' && !t.enabled) return false;
    if(templateEnabled==='disabled' && t.enabled) return false;
    const kw = templateSearch.trim().toLowerCase();
    if(!kw) return true;
    return [t.title,t.slug,t.category,(t.tags||[]).join(' ')].filter(Boolean).some(v=>String(v).toLowerCase().includes(kw));
  });
  const filteredImages = images.filter(i => {
    const kw = imageSearch.trim().toLowerCase();
    if(!kw) return true;
    return [i.name,i.image,i.description].filter(Boolean).some(v=>String(v).toLowerCase().includes(kw));
  });
  const filteredInstances = instances.filter(i => {
    const kw = instanceSearch.trim().toLowerCase();
    if(!kw) return true;
    return [i.email,i.instance_type,i.status,i.id].filter(Boolean).some(v=>String(v).toLowerCase().includes(kw));
  });
  const tablePagination = total => ({pageSize:10,showSizeChanger:true,pageSizeOptions:['10','20','50','100'],showTotal:(t,r)=>`${r[0]}-${r[1]} of ${t}`});

  return React.createElement(Layout,null,
    React.createElement(Header,{className:'header'},
      React.createElement('div',{className:'brand'},React.createElement('img',{src:'https://amd-ai-academy.com/static/image.png'}),React.createElement('span',null,'Radeon Cloud Admin')),
