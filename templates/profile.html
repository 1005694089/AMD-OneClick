    function displayInstanceStatus(inst) {
      if (!inst || !inst.live_status) return '';
      if (inst.live_reason === 'Unschedulable') return 'Waiting for available GPU resources';
      if (inst.live_reason === 'ImagePullBackOff' || inst.live_reason === 'ErrImagePull') return 'Image pull failed';
      if (inst.live_reason === 'ContainerCreating') return 'Preparing workspace';
      if (inst.live_reason === 'JupyterStarting') return 'Jupyter is starting';
      if (inst.live_status === 'distributing') return 'Loading image onto the GPU node';
      if (inst.live_status === 'terminating' || inst.live_status === 'deleting') return 'Shutting down';
      if (inst.live_status === 'ready') return 'Ready';
      return inst.live_message || inst.live_status;
    }

    function displayInstanceDetail(inst) {
      if (!inst || !inst.live_status || inst.live_status === 'ready') return '';
      if (inst.live_reason === 'Unschedulable') return 'No suitable GPU node is available yet. You can keep waiting or destroy and retry later.';
      if (inst.live_status === 'distributing') return 'The image is being copied to the GPU node before your workspace starts.';
      return inst.live_reason || '';

        return () => clearInterval(timer);

      React.useEffect(() => {
        if (!activeInstance || !activeInstance.instance_id) return;
        let cancelled = false;
        let timer = null;
        async function check() {
          try {
            const res = await fetch('/api/notebook/status');
            const data = await res.json();
            if (cancelled) return;
            if (data.status === 'ready') {
              setInstanceReady(true);
              if (timer) clearInterval(timer);
            } else {
              setInstanceReady(false);
            }
          } catch (e) {}
        }
        check();
        timer = setInterval(check, 5000);
        return () => { cancelled = true; if (timer) clearInterval(timer); };
      }, []);

          message.error(e.message || 'Build failed to start');

          setBuildLoading(false);
        }
      }

          loadCustomImages();

          const data = await res.json().catch(() => ({}));
          message.error(data.detail || 'Delete failed');
        }
      }

          tags: (record.tags || []).join(', '),
        } : {
          branch: 'main',
          image: defaultImage,
          enabled: false,
        });
        setTemplateModalOpen(true);
      }

      async function saveTemplate(values) {
        const payload = {
          ...values,
          slug: editingTemplate ? editingTemplate.slug : '',
          tags: values.tags || '',
          enabled: isEditor ? (values.enabled === true) : false,
          sort_order: 0,
        };
        const url = editingTemplate ? `/api/profile/templates/${editingTemplate.id}` : '/api/profile/templates';
        const res = await fetch(url, {
          method: editingTemplate ? 'PUT' : 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          message.success(editingTemplate ? 'Template updated' : 'Template added');
          templateForm.resetFields();
          setEditingTemplate(null);
          setTemplateModalOpen(false);
          loadEditorTemplates();
        } else {
          message.error(data.detail || 'Template save failed');
        }
      }

        const res = await fetch(`/api/profile/templates/${id}`, { method: 'DELETE' });
