<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview Syncing - Radeon Cloud</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f7f8fc; color:#1f2430; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .card { width:min(720px, calc(100vw - 40px)); background:#fff; border:1px solid #e7eaf2; border-radius:24px; padding:34px; box-shadow:0 24px 60px rgba(30,34,60,.12); }
    .eyebrow { font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:#687086; font-weight:800; }
    h1 { margin:10px 0 12px; font-size:30px; letter-spacing:-.03em; }
    p { margin:0 0 16px; color:#576071; line-height:1.7; }
    .status { display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border-radius:999px; background:#f0f3ff; color:#315efb; font-weight:800; font-size:13px; }
    .error { margin-top:18px; padding:12px 14px; border-radius:14px; background:#fff4f2; color:#9f2a1d; white-space:pre-wrap; }
    .actions { margin-top:24px; display:flex; gap:12px; flex-wrap:wrap; }
    .btn { border:0; border-radius:999px; padding:10px 18px; background:#171726; color:#fff; text-decoration:none; font-weight:800; cursor:pointer; }
    .btn.secondary { background:#eef1f7; color:#24283a; }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Notebook Preview</div>
    <h1 id="title"></h1>
    <p id="message"></p>
    <span class="status" id="status"></span>
    <div class="error" id="error" style="display:none"></div>
    <div class="actions">
      <button class="btn" id="refreshBtn">Refresh</button>
      <button class="btn secondary" id="retryBtn" style="display:none">Retry Sync</button>
      <a class="btn secondary" href="/">Back to Gallery</a>
    </div>
  </main>
  <script>
    const template = {{ template_json | safe }};
    const preview = {{ preview_json | safe }};
    const canRetry = {{ can_retry | tojson }};
    const status = preview.status || 'pending';
    document.getElementById('title').textContent = template.title || 'Notebook Template';
    document.getElementById('status').textContent = status;
    document.getElementById('message').textContent = status === 'failed'
      ? 'Preview sync failed. You can retry if you own this template, or come back later after the background sync runs.'
      : 'Preview content is being synced in the background. This page no longer waits on GitHub during your request.';
    if (preview.error_message) {
      const error = document.getElementById('error');
      error.style.display = 'block';
      error.textContent = preview.error_message;
    }
    document.getElementById('refreshBtn').onclick = () => window.location.reload();
    if (canRetry) {
      const retry = document.getElementById('retryBtn');
      retry.style.display = 'inline-flex';
      retry.onclick = async () => {
        retry.disabled = true;
        retry.textContent = 'Retrying...';
        const res = await fetch(`/api/profile/templates/${template.id}/sync-preview`, { method:'POST' });
        retry.textContent = res.ok ? 'Sync Queued' : 'Retry Failed';
        setTimeout(() => window.location.reload(), 1600);
      };
    }
  </script>
</body>
</html>
