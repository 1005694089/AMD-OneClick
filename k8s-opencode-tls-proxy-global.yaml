# OpenCode TLS-terminating NodePort proxy for radeon-global.
# Gives OpenCode web its own origin (distinct by port 30450) so the manager's
# opencode_origin_proxy middleware activates and injects per-instance Basic auth.
# nginx terminates TLS on NodePort 30450 and forwards to the manager Service,
# setting X-Forwarded-Port: 30450 (the signal the manager keys on).
# Deployed into amd-oneclick-lablab (no separate edge namespace exists on this cluster).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: amd-oneclick-opencode-tls-proxy-nginx
  namespace: amd-oneclick-lablab
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    upstream amd_oneclick_lablab_manager {
      server amd-oneclick-lablab-manager.amd-oneclick-lablab.svc.cluster.local:80;
      keepalive 64;
    }

    server {
      listen 8443 ssl;
      http2 on;
      server_name radeon-global.anruicloud.com;

      ssl_certificate /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_session_cache shared:SSL:10m;
      ssl_session_timeout 10m;

      client_max_body_size 0;
      client_body_timeout 3600s;
      send_timeout 3600s;
      proxy_http_version 1.1;
      proxy_connect_timeout 30s;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_max_temp_file_size 0;

      location /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
      }

      location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # MUST equal the Service nodePort below AND the port in the manager's
        # OPENCODE_PUBLIC_BASE_URL. Change all three together.
        proxy_set_header X-Forwarded-Port 30450;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://amd_oneclick_lablab_manager;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amd-oneclick-opencode-tls-proxy
  namespace: amd-oneclick-lablab
  labels:
    app: amd-oneclick-opencode-tls-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amd-oneclick-opencode-tls-proxy
  template:
    metadata:
      labels:
        app: amd-oneclick-opencode-tls-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: amd-oneclick-opencode-tls-proxy-nginx
        - name: tls
          secret:
            secretName: amd-oneclick-opencode-tls
---
apiVersion: v1
kind: Service
metadata:
  name: amd-oneclick-opencode-tls-proxy
  namespace: amd-oneclick-lablab
  labels:
    app: amd-oneclick-opencode-tls-proxy
spec:
  type: NodePort
  selector:
    app: amd-oneclick-opencode-tls-proxy
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      nodePort: 30450
