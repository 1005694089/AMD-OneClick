---
apiVersion: v1
kind: Namespace
metadata:
  name: amd-oneclick-edge-proxy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: amd-oneclick-edge-nginx
  namespace: amd-oneclick-edge-proxy
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    upstream amd_oneclick_manager {
      server 10.233.217.68:80;
      keepalive 64;
    }

    server {
      listen 80;
      server_name _;

      client_max_body_size 0;
      client_body_timeout 3600s;
      send_timeout 3600s;

      proxy_http_version 1.1;
      proxy_connect_timeout 30s;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_max_temp_file_size 0;

      location /edge-healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
      }

      location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Port 80;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_pass http://amd_oneclick_manager;
      }
    }

    server {
      listen 443 ssl http2;
      server_name _;

      ssl_certificate /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_session_cache shared:SSL:10m;
      ssl_session_timeout 10m;

      client_max_body_size 0;
      client_body_timeout 3600s;
      send_timeout 3600s;

      proxy_http_version 1.1;
      proxy_connect_timeout 30s;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_max_temp_file_size 0;

      location /edge-healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
      }

      location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_pass http://amd_oneclick_manager;
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amd-oneclick-edge-nginx
  namespace: amd-oneclick-edge-proxy
spec:
  selector:
    matchLabels:
      app: amd-oneclick-edge-nginx
  template:
    metadata:
      labels:
        app: amd-oneclick-edge-nginx
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              hostPort: 80
            - name: https
              containerPort: 443
              hostPort: 443
          readinessProbe:
            httpGet:
              path: /edge-healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /edge-healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: amd-oneclick-edge-nginx
        - name: tls
          secret:
            secretName: amd-oneclick-edge-tls
